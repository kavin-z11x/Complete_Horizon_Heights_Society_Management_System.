<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Horizon Heights Residency | Smart Society & Resident Management</title>
  <meta name="description" content="Next-generation society and resident management system for Horizon Heights Residency. Handle notices, complaints, visitor passes, maintenance bills, amenities, and community polls seamlessly.">
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- FontAwesome 6 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <!-- Custom Stylesheet -->
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>

  <div class="app-container">
    <!-- Sidebar Navigation -->
    <aside class="sidebar" id="sidebar">
      <div class="brand-header">
        <div class="brand-logo">
          <i class="fa-solid fa-building-shield"></i>
        </div>
        <div>
          <h1 class="brand-title" style="font-size: 1.15rem; margin: 0;">Horizon Heights</h1>
          <span class="society-badge"><i class="fa-solid fa-circle-check"></i> Residency Portal</span>
        </div>
      </div>

      <nav class="nav-menu" id="nav-menu">
        <div class="nav-item active" data-view="dashboard" id="nav-dashboard">
          <i class="fa-solid fa-chart-pie"></i>
          <span>Dashboard</span>
        </div>
        <div class="nav-item" data-view="notices" id="nav-notices">
          <i class="fa-solid fa-bullhorn"></i>
          <span>Notices & News</span>
          <span class="nav-badge" id="badge-notices">0</span>
        </div>
        <div class="nav-item" data-view="complaints" id="nav-complaints">
          <i class="fa-solid fa-screwdriver-wrench"></i>
          <span>Helpdesk</span>
          <span class="nav-badge" id="badge-complaints">0</span>
        </div>
        <div class="nav-item" data-view="maintenance" id="nav-maintenance">
          <i class="fa-solid fa-file-invoice-dollar"></i>
          <span>Maintenance</span>
          <span class="nav-badge" id="badge-maintenance">0</span>
        </div>
        <div class="nav-item" data-view="visitors" id="nav-visitors">
          <i class="fa-solid fa-id-badge"></i>
          <span>Visitor Passes</span>
          <span class="nav-badge" id="badge-visitors">0</span>
        </div>
        <div class="nav-item" data-view="amenities" id="nav-amenities">
          <i class="fa-solid fa-swimming-pool"></i>
          <span>Amenities</span>
        </div>
        <div class="nav-item" data-view="polls" id="nav-polls">
          <i class="fa-solid fa-square-poll-vertical"></i>
          <span>Community Polls</span>
        </div>
        <div class="nav-item" data-view="directory" id="nav-directory">
          <i class="fa-solid fa-address-book"></i>
          <span>Directory</span>
        </div>
        <div class="nav-item" data-view="emergency" id="nav-emergency">
          <i class="fa-solid fa-phone-volume"></i>
          <span>24/7 Emergency</span>
        </div>
        <div class="nav-item" data-view="backup" id="nav-backup">
          <i class="fa-solid fa-sliders"></i>
          <span>System & Data</span>
        </div>
      </nav>

      <!-- Role Switcher Component -->
      <div class="role-switcher-card">
        <div class="user-info">
          <div class="user-avatar" id="user-avatar-initials">JD</div>
          <div class="user-details">
            <h5 id="user-display-name">John Doe</h5>
            <span id="user-display-meta">Flat A-402 • Resident</span>
          </div>
        </div>
        <label for="role-select" style="font-size: 0.72rem; text-transform: uppercase; color: var(--text-muted); font-weight: 600; margin-bottom: 4px; display: block;">Active Role Simulation</label>
        <select class="role-select" id="role-select">
          <option value="resident">Resident (John Doe - A-402)</option>
          <option value="admin">Society Admin (Manager)</option>
          <option value="security">Security Officer (Gate 1)</option>
        </select>
      </div>
    </aside>

    <!-- Main Content Area -->
    <div class="main-wrapper">
      <!-- Top Header Navbar -->
      <header class="top-header">
        <div class="header-title-group">
          <h2 id="page-title">Community Overview</h2>
        </div>
        <div class="header-actions">
          <button class="action-btn action-btn-primary" id="btn-header-action">
            <i class="fa-solid fa-plus"></i>
            <span id="btn-header-action-label">Quick Action</span>
          </button>
          <button class="icon-btn" id="btn-theme-toggle" title="Switch Theme (Dark / Light)" aria-label="Toggle Theme">
            <i class="fa-solid fa-moon"></i>
          </button>
          <button class="icon-btn" id="btn-reset-demo" title="Reset to Default Demo State" aria-label="Reset Data">
            <i class="fa-solid fa-arrow-rotate-right"></i>
          </button>
        </div>
      </header>

      <!-- Main Dynamic Content Body -->
      <main class="content-body" id="view-container">
        <!-- Rendered by js/app.js -->
      </main>
    </div>
  </div>

  <!-- Reusable Dynamic Modal -->
  <div class="modal-overlay" id="modal-overlay" role="dialog" aria-modal="true" aria-hidden="true">
    <div class="modal-box" id="modal-box">
      <!-- Injected dynamically -->
    </div>
  </div>

  <!-- Toast Notification System -->
  <div class="toast-container" id="toast-container" aria-live="polite"></div>

  <!-- Main ES6 Application Controller -->
  <script type="module" src="./js/app.js"></script>
</body>
</html>
